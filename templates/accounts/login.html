{% load static %}<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 — {{ system_name }}</title>
  <link href="{% static 'css/tokens.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
  <div class="login-shell">
    {% include "accounts/_auth_brand.html" %}
    <section class="login-form-zone">
      <div class="login-card">
        <h2>账号登录</h2>
        <p class="sub">企业用户请先注册，经评价机构审核通过后登录。</p>
        {% if form.errors %}
        <div class="alert danger" role="alert">
          {% for error in form.non_field_errors %}<div>{{ error }}</div>{% empty %}<div>请填写用户名和密码。</div>{% endfor %}
        </div>
        {% endif %}
        <form method="post" class="form-grid">
          {% csrf_token %}
          <div class="field">
            <label class="field-label" for="id_username">用户名</label>
            <input type="text" name="username" id="id_username" class="input" value="{{ form.username.value|default:'' }}" autofocus autocomplete="username" required>
          </div>
          <div class="field">
            <label class="field-label" for="id_password">密码</label>
            <input type="password" name="password" id="id_password" class="input" autocomplete="current-password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn primary" type="submit" style="width:100%">登 录</button>
        </form>
        <div class="auth-switch">
          <span>还没有账号？</span>
          <a class="btn secondary" href="{% url 'accounts:register' %}" style="width:100%">企业注册</a>
        </div>
        <p class="small muted" style="margin-top:16px">忘记密码请联系评价机构管理员重置。</p>
      </div>
    </section>
  </div>
</body>
</html>
