[project]
name = "trl-evaluation-system"
version = "0.1.0"
description = "技术就绪度与制造成熟度评价系统（机械工业仪器仪表综合技术经济研究所）"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "python-docx>=1.1",
    "docxtpl>=0.20",
    "openpyxl>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pillow>=10",
]
# 单机桌面窗口（打包 exe 时使用）
desktop = [
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
